stages:
  - test
  - build

# Shell executor kullanıldığı için 'image' etiketi yoksayılacaktır.
# Go'nun sisteminizde yüklü olduğundan emin olun.

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  CGO_ENABLED: 0
  # DB_HOST IP adresi kullanıcı tarafından güncellendi
  DB_HOST: 172.28.6.165 
  DB_PORT: 5432
  DB_USER: bap
  DB_PASSWORD: bap_admin_1
  DB_NAME: bap_app

cache:
  key: ${CI_COMMIT_REF_SLUG}-go-cache
  paths:
    - .cache/go-build
    - .cache/go-mod

before_script:
  - echo "Current PATH: $PATH"
  - ls -la /usr/local/go/bin/go || echo "Go binary not found at /usr/local/go/bin/go"
  - export PATH=$PATH:/usr/local/go/bin
  - go version || (echo "Go still not found, checking alternatives..." && which go || echo "go command not found anywhere")
  - mkdir -p .cache/go-build .cache/go-mod
  - go mod download

# Fmt ve Vet adımları birleştirilerek overhead azaltıldı
lint:
  stage: test
  script:
    - echo "Checking formatting..."
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted. Please run 'go fmt ./...'"; gofmt -d .; exit 1; fi
    - echo "Running go vet..."
    - go vet ./...

unit_tests:
  stage: test
  script:
    - go test -v ./tests/...

# Build işlemi optimize edilmiş bayraklar ile güncellendi
build_app:
  stage: build
  script:
    - go build -v -trimpath -ldflags="-s -w" -o main ./cmd/server/main.go
  artifacts:
    paths:
      - main
    expire_in: 1 week
