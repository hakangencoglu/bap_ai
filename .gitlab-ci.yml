stages:
  - test
  - build
  - deploy

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  CGO_ENABLED: 0
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

cache:
  key: ${CI_COMMIT_REF_SLUG}-go-cache
  paths:
    - .cache/go-build
    - .cache/go-mod

before_script:
  - export PATH=$PATH:/usr/local/go/bin
  - mkdir -p .cache/go-build .cache/go-mod

lint:
  stage: test
  script:
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted."; gofmt -d .; exit 1; fi
    - go vet ./...

unit_tests:
  stage: test
  script:
    - go test -v ./tests/...

# Docker imajını oluştur ve Registry'e gönder
build_docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

# Sunucuya dağıt (Deploy)
deploy_prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh root@$SERVER_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh root@$SERVER_IP "cd /path/to/project && docker-compose pull"
    - ssh root@$SERVER_IP "cd /path/to/project && docker-compose up -d"
  only:
    - main
  when: manual # İlk etapta manuel tetikleme güvenlidir
