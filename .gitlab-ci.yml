stages:
  - test
  - build

image: golang:1.24

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  CGO_ENABLED: 0

cache:
  paths:
    - .go/pkg/mod

before_script:
  - mkdir -p .go
  - go mod download

format_check:
  stage: test
  script:
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted. Please run 'go fmt ./...'"; gofmt -d .; exit 1; fi

vet:
  stage: test
  script:
    - go vet ./...

unit_tests:
  stage: test
  script:
    - go test -v ./...

build_app:
  stage: build
  script:
    - go build -v -o main ./cmd/server/main.go
  artifacts:
    paths:
      - main

docker_build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t bap-ai-verify .
