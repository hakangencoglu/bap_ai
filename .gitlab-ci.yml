stages:
  - test
  - build

image: golang:1.26

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  CGO_ENABLED: 0
  POSTGRES_DB: bap_app
  POSTGRES_USER: bap
  POSTGRES_PASSWORD: bap_admin_1
  POSTGRES_HOST_AUTH_METHOD: trust

cache:
  paths:
    - .go/pkg/mod

before_script:
  - mkdir -p .go
  - go mod download

format_check:
  stage: test
  script:
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted. Please run 'go fmt ./...'"; gofmt -d .; exit 1; fi

vet:
  stage: test
  script:
    - go vet ./...

unit_tests:
  stage: test
  services:
    - postgres:16-alpine
  variables:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: bap
    DB_PASSWORD: bap_admin_1
    DB_NAME: bap_app
  script:
    - go test -v ./tests/...

build_app:
  stage: build
  script:
    - go build -v -o main ./cmd/server/main.go
  artifacts:
    paths:
      - main
