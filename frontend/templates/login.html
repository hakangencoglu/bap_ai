<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İstanbul Sabahattin Zaim Üniversitesi BAP Bilimsel Araştırma Projesi Sistemi - Giriş Yap">
    <title>Giriş Yap | BAP Sistemi - İZÜ</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script>
        (function() {
            const theme = localStorage.getItem('bap_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="../static/js/translations.js"></script>
    <script src="../static/js/i18n.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card" id="loginCard">
                <!-- Header / Logo -->
                <div class="auth-header">
                    <img src="../static/images/izu_logo.png" alt="İZÜ Logo">
                    <h1 data-i18n="auth.welcome">Hoş Geldiniz</h1>
                    <p data-i18n="auth.login_desc">BAP Bilimsel Araştırma Projesi Sistemi'ne giriş yapın.</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" action="/api/auth/login" method="POST">
                    <div class="form-group">
                        <label for="email" data-i18n="auth.email">E-posta Adresi</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="ornek@izu.edu.tr" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" data-i18n="auth.password">Şifre</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="remember" name="remember">
                            <span data-i18n="auth.remember">Beni hatırla</span>
                        </label>
                        <a href="#" data-i18n="auth.forgot_password">Şifremi unuttum</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="auth.login_btn">Giriş Yap</button>
                </form>

                <!-- Footer -->
                <div class="auth-footer">
                    <span data-i18n="auth.no_account">Hesabınız yok mu?</span> <a href="/register" data-i18n="auth.register_link">Kayıt Ol</a>
                </div>
            </div>

            <!-- Password Creation Card (Hidden by default) -->
            <div class="auth-card" id="setPasswordCard" style="display: none;">
                <div class="auth-header">
                    <img src="../static/images/izu_logo.png" alt="İZÜ Logo">
                    <h1>Şifre Oluştur 🔐</h1>
                    <p>Sisteme ilk kez giriş yapıyorsunuz. Lütfen hesabınız için yeni bir giriş şifresi belirleyin.</p>
                </div>

                <form id="setPasswordForm">
                    <input type="hidden" id="sp-email">

                    <div class="form-group">
                        <label for="sp-password">Yeni Şifre</label>
                        <input 
                            type="password" 
                            id="sp-password" 
                            name="password" 
                            class="form-control" 
                            placeholder="En az 6 karakter" 
                            required
                            minlength="6"
                        >
                    </div>

                    <div class="form-group">
                        <label for="sp-password-confirm">Yeni Şifre Tekrar</label>
                        <input 
                            type="password" 
                            id="sp-password-confirm" 
                            name="password-confirm" 
                            class="form-control" 
                            placeholder="Şifreyi onaylayın" 
                            required
                            minlength="6"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Şifreyi Kaydet ve Giriş Yap</button>
                    <button type="button" class="btn btn-outline btn-block" style="margin-top: 0.5rem;" onclick="showLoginCard()">Geri Dön</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ eposta: email, sifre: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    
                    // Token'dan profil tamamlanma durumunu kontrol et
                    const profilTamamlandi = data.uye && data.uye.profil_tamamlandi;
                    
                    if (!profilTamamlandi) {
                        // Profil tamamlanmamışsa profil tamamlama sayfasına yönlendir
                        window.location.href = '/profil-tamamla';
                    } else if (data.uye && data.uye.rol === 'admin') {
                        // rol admin ise, admin dashboard'una yönlendir
                        window.location.href = '/admin/dashboard';
                    } else if (data.uye && data.uye.rol === 'hakem') {
                        // rol hakem ise, hakem dashboard'una yönlendir
                        window.location.href = '/hakem/dashboard';
                    } else if (data.uye && data.uye.rol === 'dekan') {
                        // rol dekan ise, dekan dashboard'una yönlendir
                        window.location.href = '/dekan/dashboard';
                    } else if (data.uye && (data.uye.rol === 'komisyon' || data.uye.rol === 'komisyon_raportoru')) {
                        // rol komisyon veya komisyon_raportoru ise, komisyon dashboard'una yönlendir
                        window.location.href = '/komisyon/dashboard';
                    } else if (data.uye && data.uye.rol === 'komisyon_baskani') {
                        // rol komisyon_baskani ise, komisyon başkanı dashboard'una yönlendir
                        window.location.href = '/komisyon/baskan/dashboard';
                    } else if (data.uye && data.uye.rol === 'tto') {
                        // rol tto ise, tto dashboard'una yönlendir
                        window.location.href = '/tto/dashboard';
                    } else {
                        // Diğer kullanıcılar (akademisyen vb.) için ana dashboard
                        window.location.href = '/anasayfa';
                    }
                } else if (data.error === 'sifre_olusturulmali') {
                    // Şifre oluşturma ekranına yönlendir
                    document.getElementById('sp-email').value = email;
                    document.getElementById('loginCard').style.display = 'none';
                    document.getElementById('setPasswordCard').style.display = 'block';
                } else {
                    alert('Giriş başarısız: ' + (data.error || 'Bilinmeyen hata'));
                }
            } catch (err) {
                console.error(err);
                alert('Sunucuya bağlanılamadı.');
            }
        });

        document.getElementById('setPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('sp-email').value;
            const password = document.getElementById('sp-password').value;
            const confirmPassword = document.getElementById('sp-password-confirm').value;
            
            if (password !== confirmPassword) {
                alert('Şifreler uyuşmuyor!');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ eposta: email, sifre: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    
                    const profilTamamlandi = data.uye && data.uye.profil_tamamlandi;
                    
                    if (!profilTamamlandi) {
                        window.location.href = '/profil-tamamla';
                    } else if (data.uye && data.uye.rol === 'admin') {
                        window.location.href = '/admin/dashboard';
                    } else if (data.uye && data.uye.rol === 'hakem') {
                        window.location.href = '/hakem/dashboard';
                    } else if (data.uye && data.uye.rol === 'dekan') {
                        window.location.href = '/dekan/dashboard';
                    } else if (data.uye && (data.uye.rol === 'komisyon' || data.uye.rol === 'komisyon_raportoru')) {
                        window.location.href = '/komisyon/dashboard';
                    } else if (data.uye && data.uye.rol === 'komisyon_baskani') {
                        window.location.href = '/komisyon/baskan/dashboard';
                    } else if (data.uye && data.uye.rol === 'tto') {
                        window.location.href = '/tto/dashboard';
                    } else {
                        window.location.href = '/anasayfa';
                    }
                } else {
                    alert('Şifre oluşturma başarısız: ' + (data.error || 'Bilinmeyen hata'));
                }
            } catch (err) {
                console.error(err);
                alert('Sunucuya bağlanılamadı.');
            }
        });

        function showLoginCard() {
            document.getElementById('setPasswordCard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('sp-password').value = '';
            document.getElementById('sp-password-confirm').value = '';
        }
    </script>

</body>
</html>
