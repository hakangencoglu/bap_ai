<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İstanbul Sabahattin Zaim Üniversitesi BAP Bilimsel Araştırma Projesi Sistemi - Giriş Yap">
    <title>Giriş Yap | BAP Sistemi - İZÜ</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script>
        (function() {
            const theme = localStorage.getItem('bap_theme') || 'light';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script src="../static/js/translations.js"></script>
    <script src="../static/js/i18n.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <!-- Header / Logo -->
                <div class="auth-header">
                    <img src="../static/images/izu_logo.png" alt="İZÜ Logo">
                    <h1 data-i18n="auth.welcome">Hoş Geldiniz</h1>
                    <p data-i18n="auth.login_desc">BAP Bilimsel Araştırma Projesi Sistemi'ne giriş yapın.</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" action="/api/auth/login" method="POST">
                    <div class="form-group">
                        <label for="email" data-i18n="auth.email">E-posta Adresi</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="ornek@izu.edu.tr" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" data-i18n="auth.password">Şifre</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="remember" name="remember">
                            <span data-i18n="auth.remember">Beni hatırla</span>
                        </label>
                        <a href="#" data-i18n="auth.forgot_password">Şifremi unuttum</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="auth.login_btn">Giriş Yap</button>
                </form>

                <!-- Footer -->
                <div class="auth-footer">
                    <span data-i18n="auth.no_account">Hesabınız yok mu?</span> <a href="/register" data-i18n="auth.register_link">Kayıt Ol</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ iletisim_mail: email, password: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    
                    if (data.uye && data.uye.role_id === 1) {
                        // role_id 1 ise (admin), admin dashboard'una yönlendir
                        window.location.href = '/admin/dashboard';
                    } else if (data.uye && data.uye.role_id === 4) {
                        // role_id 4 ise (hakem), hakem dashboard'una yönlendir
                        window.location.href = '/hakem/dashboard';
                    } else {
                        // Diğer kullanıcılar (akademisyen vb.) için ana dashboard
                        window.location.href = '/anasayfa';
                    }
                } else {
                    alert('Giriş başarısız: ' + (data.error || 'Bilinmeyen hata'));
                }
            } catch (err) {
                console.error(err);
                alert('Sunucuya bağlanılamadı.');
            }
        });
    </script>
</body>
</html>
