<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Değerlendirme | BAP Sistemi - İZÜ</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const theme = localStorage.getItem('bap_theme') || 'light';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        .eval-section {
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
        }
        .eval-title {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
    </style>
    <script src="../static/js/translations.js"></script>
    <script src="../static/js/i18n.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <img src="../static/images/izu_logo.png" alt="İZÜ Logo">
                    <div class="brand-logo-text">
                        <span class="university-name">İSTANBUL SABAHATTİN ZAİM</span>
                        <span class="system-name">BAP SİSTEMİ</span>
                    </div>
                </div>
            </div>
            <nav class="sidebar-menu">
                <div class="menu-label">Hakem Menüsü</div>
                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="/hakem/dashboard">
                            <i class="fas fa-arrow-left"></i>
                            <span>Listeye Dön</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content area -->
        <main class="main-wrapper">
            <header class="topbar">
                <div class="breadcrumb">
                    <span class="breadcrumb-item">BAP Sistemi</span>
                    <span class="breadcrumb-item active">Proje Değerlendirme Formu</span>
                </div>
                <div class="topbar-right">
                    <button class="theme-toggle" id="themeToggle" title="Tema Değiştir">
                        <i class="fas fa-sun icon-sun"></i>
                        <i class="fas fa-moon icon-moon"></i>
                    </button>
                    <div class="user-profile" id="profileToggle">
                        <div class="avatar" id="user-avatar">H</div>
                        <div class="user-info">
                            <span class="user-name">Hakem</span>
                            <span class="user-role">Değerlendirme Ekranı</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <h1 class="page-title">Proje Değerlendirmesi Yap</h1>
                    <p class="page-description">İlgili projenin içeriğini değerlendirerek formu doldurunuz.</p>
                </div>

                <div class="eval-section">
                    <h2 class="eval-title">Değerlendirme Formu</h2>
                    <form id="evaluationForm">
                        <div class="form-group mb-2">
                            <label for="projeDurum">Proje Hakkındaki Kararınız</label>
                            <select id="projeDurum" class="form-control" required>
                                <option value="" disabled selected>Karar Seçiniz...</option>
                                <option value="Onaylandı">Onayla</option>
                                <option value="Reddedildi">Reddet</option>
                                <option value="Revizyon">Revizyon Talebi</option>
                            </select>
                        </div>

                        <div class="form-group mb-2">
                            <label for="projePuan">Genel Puan (0-100 Arası)</label>
                            <input type="number" id="projePuan" class="form-control" min="0" max="100" placeholder="Örn: 85" required />
                        </div>

                        <div class="form-group mb-3">
                            <label for="projeYorum">Gerekçeli Karar ve Yorumlar</label>
                            <textarea id="projeYorum" class="form-control" rows="6" placeholder="Projenin özgünlüğü, yöntemi ve genel durumu hakkındaki yorumlarınızı buraya yazınız..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Değerlendirmeyi Kaydet
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const projeIdStr = urlParams.get('id');
            const projeId = parseInt(projeIdStr);

            if (!projeId || isNaN(projeId)) {
                alert("Geçersiz proje bağlantısı!");
                window.location.href = '/hakem/dashboard';
                return;
            }

            // Rol kontrolü
            fetch('/api/profil/bilgiler', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(res => {
                if (res.ok) {
                    res.json().then(data => {
                        if (data.rol !== 'hakem') {
                            alert("Bu sayfayı görüntüleme yetkiniz yoktur (Hakem yetkisi gerektirir).");
                            window.location.href = '/anasayfa';
                        }
                    });
                }
            }).catch(err => console.error(err));

            document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const durum = document.getElementById('projeDurum').value;
                const puan = parseInt(document.getElementById('projePuan').value);
                const yorum = document.getElementById('projeYorum').value;

                if (puan < 0 || puan > 100) {
                    alert('Lütfen 0 ile 100 arasında bir puan veriniz.');
                    return;
                }

                try {
                    const response = await fetch('/api/hakem/degerlendir', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            proje_id: projeId,
                            puan: puan,
                            yorum: yorum,
                            durum: durum
                        })
                    });

                    const result = await response.json();
                    if (response.ok) {
                        alert('Değerlendirme başarıyla kaydedildi!');
                        window.location.href = '/hakem/dashboard';
                    } else {
                        alert('Hata: ' + result.error);
                    }
                } catch(error) {
                    console.error('Submit Error:', error);
                    alert('Değerlendirme sırasında bir hata oluştu!');
                }
            });
        });

        const themeToggle = document.getElementById('themeToggle');
        themeToggle?.addEventListener('click', (e) => {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('bap_theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('bap_theme', 'dark');
            }
        });
    </script>
</body>
</html>
