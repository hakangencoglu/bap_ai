<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İstanbul Sabahattin Zaim Üniversitesi BAP Sistemi - Kayıt Ol">
    <title>Kayıt Ol | BAP Sistemi - İZÜ</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card wide">
                <!-- Header / Logo -->
                <div class="auth-header">
                    <img src="../static/images/izu_logo.png" alt="İZÜ Logo">
                    <h1>Kayıt Ol</h1>
                    <p>BAP Sistemi'ni kullanmak için hesap oluşturun.</p>
                </div>

                <!-- Register Form -->
                <form id="registerForm" action="/api/auth/register" method="POST">
                    <!-- Ad Soyad -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="ad">Ad</label>
                            <input 
                                type="text" 
                                id="ad" 
                                name="ad" 
                                class="form-control" 
                                placeholder="Adınız" 
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="soyad">Soyad</label>
                            <input 
                                type="text" 
                                id="soyad" 
                                name="soyad" 
                                class="form-control" 
                                placeholder="Soyadınız" 
                                required
                            >
                        </div>
                    </div>

                    <!-- E-posta -->
                    <div class="form-group">
                        <label for="iletisim_mail">E-posta Adresi</label>
                        <input 
                            type="email" 
                            id="iletisim_mail" 
                            name="iletisim_mail" 
                            class="form-control" 
                            placeholder="ornek@izu.edu.tr" 
                            required
                        >
                    </div>

                    <!-- Rol Seçimi -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="role_id">Rol</label>
                            <select id="role_id" name="role_id" class="form-control" required>
                                <option value="" disabled selected>Rolünüzü seçin</option>
                                <option value="2">Akademisyen</option>
                                <option value="3">Öğrenci</option>
                                <option value="1">Admin</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="unvan">Unvan</label>
                            <input 
                                type="text" 
                                id="unvan" 
                                name="unvan" 
                                class="form-control" 
                                placeholder="Örn: Prof. Dr."
                            >
                        </div>
                    </div>

                    <!-- Bölüm ve Telefon -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="bolum">Bölüm / Fakülte</label>
                            <input 
                                type="text" 
                                id="bolum" 
                                name="bolum" 
                                class="form-control" 
                                placeholder="Bilgisayar Mühendisliği"
                            >
                        </div>
                        <div class="form-group">
                            <label for="iletisim_tel">Telefon</label>
                            <input 
                                type="text" 
                                id="iletisim_tel" 
                                name="iletisim_tel" 
                                class="form-control" 
                                placeholder="05xx..."
                            >
                        </div>
                    </div>

                    <!-- Şifre -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Şifre</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-control" 
                                placeholder="En az 6 karakter" 
                                required
                                minlength="6"
                            >
                        </div>
                        <div class="form-group">
                            <label for="passwordConfirm">Şifre Tekrar</label>
                            <input 
                                type="password" 
                                id="passwordConfirm" 
                                name="password_confirm" 
                                class="form-control" 
                                placeholder="Şifrenizi tekrar girin" 
                                required
                                minlength="6"
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">Kayıt Ol</button>
                </form>

                <!-- Footer -->
                <div class="auth-footer">
                    Zaten hesabınız var mı? <a href="/">Giriş Yap</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                // Sayısal alanları dönüştür
                if (key === 'role_id') {
                    data[key] = parseInt(value);
                } else {
                    data[key] = value;
                }
            });

            // Şifre kontrolü
            if (data.password !== data.password_confirm) {
                alert('Şifreler uyuşmuyor!');
                return;
            }

            // password_confirm alanını backend'e gönderme
            delete data.password_confirm;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz.');
                    window.location.href = '/';
                } else {
                    alert('Kayıt başarısız: ' + (result.error || 'Bilinmeyen hata'));
                }
            } catch (err) {
                console.error(err);
                alert('Sunucuya bağlanılamadı.');
            }
        });
    </script>
</body>
</html>
