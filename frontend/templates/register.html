<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İstanbul Sabahattin Zaim Üniversitesi BAP Sistemi - Kayıt Ol">
    <title>Kayıt Ol | BAP Sistemi - İZÜ</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script>
        (function() {
            const theme = localStorage.getItem('bap_theme') || 'light';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script src="../static/js/translations.js"></script>
    <script src="../static/js/i18n.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card wide">
                <!-- Header / Logo -->
                <div class="auth-header">
                    <img src="../static/images/izu_logo.png" alt="İZÜ Logo">
                    <h1 data-i18n="auth.register_title">Kayıt Ol</h1>
                    <p data-i18n="auth.register_desc">BAP Sistemi'ni kullanmak için hesap oluşturun.</p>
                </div>

                <!-- Register Form -->
                <form id="registerForm" action="/api/auth/register" method="POST">
                    <!-- Ad Soyad -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="ad" data-i18n="auth.name">Ad</label>
                            <input 
                                type="text" 
                                id="ad" 
                                name="ad" 
                                class="form-control" 
                                placeholder="Adınız" 
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="soyad" data-i18n="auth.surname">Soyad</label>
                            <input 
                                type="text" 
                                id="soyad" 
                                name="soyad" 
                                class="form-control" 
                                placeholder="Soyadınız" 
                                required
                            >
                        </div>
                    </div>

                    <!-- E-posta -->
                    <div class="form-group">
                        <label for="eposta" data-i18n="auth.email">E-posta Adresi</label>
                        <input 
                            type="email" 
                            id="eposta" 
                            name="eposta" 
                            class="form-control" 
                            placeholder="ornek@izu.edu.tr" 
                            required
                        >
                    </div>

                    <!-- Rol Seçimi -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rol" data-i18n="auth.role">Rol</label>
                            <select id="rol" name="rol" class="form-control" required>
                                <option value="" disabled selected>Rolünüzü seçin</option>
                                <option value="akademisyen" data-i18n="auth.role_academic">Akademisyen</option>
                                <option value="ogrenci" data-i18n="auth.role_student">Öğrenci</option>
                                <option value="hakem" data-i18n="auth.role_referee">Hakem</option>
                                <option value="admin" data-i18n="user.role_admin">Admin</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="unvan">Unvan</label>
                            <input 
                                type="text" 
                                id="unvan" 
                                name="unvan" 
                                class="form-control" 
                                placeholder="Örn: Prof. Dr."
                            >
                        </div>
                    </div>

                    <!-- Bölüm ve Telefon -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="bolum">Bölüm / Fakülte</label>
                            <input 
                                type="text" 
                                id="bolum" 
                                name="bolum" 
                                class="form-control" 
                                placeholder="Bilgisayar Mühendisliği"
                            >
                        </div>
                        <div class="form-group">
                            <label for="telefon">Telefon</label>
                            <input 
                                type="text" 
                                id="telefon" 
                                name="telefon" 
                                class="form-control" 
                                placeholder="Örn: 05xxxxxxxxx"
                                maxlength="11"
                                minlength="11"
                                pattern="\d{11}"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                                title="Lütfen sadece rakam kullanarak 11 haneli telefon numarası giriniz."
                            >
                        </div>
                    </div>

                    <!-- Şifre -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="sifre">Şifre</label>
                            <input 
                                type="password" 
                                id="sifre" 
                                name="sifre" 
                                class="form-control" 
                                placeholder="En az 6 karakter" 
                                required
                                minlength="6"
                            >
                        </div>
                        <div class="form-group">
                            <label for="sifreTekrar">Şifre Tekrar</label>
                            <input 
                                type="password" 
                                id="sifreTekrar" 
                                name="sifre_confirm" 
                                class="form-control" 
                                placeholder="Şifrenizi tekrar girin" 
                                required
                                minlength="6"
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;" data-i18n="auth.register_title">Kayıt Ol</button>
                </form>

                <!-- Footer -->
                <div class="auth-footer">
                    <span data-i18n="auth.has_account">Zaten hesabınız var mı?</span> <a href="/" data-i18n="auth.login_btn">Giriş Yap</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            // Şifre kontrolü
            if (data.sifre !== data.sifre_confirm) {
                alert('Şifreler uyuşmuyor!');
                return;
            }

            // sifre_confirm alanını backend'e gönderme
            delete data.sifre_confirm;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz.');
                    window.location.href = '/';
                } else {
                    alert('Kayıt başarısız: ' + (result.error || 'Bilinmeyen hata'));
                }
            } catch (err) {
                console.error(err);
                alert('Sunucuya bağlanılamadı.');
            }
        });
    </script>
</body>
</html>
