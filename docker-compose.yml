version: '3.8'

services:
  app:
    build: .
    image: ${CI_REGISTRY_IMAGE:-bap-app}:latest
    container_name: bap-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-bap}
      - DB_PASSWORD=${DB_PASSWORD:-bap_admin_1}
      - DB_NAME=${DB_NAME:-bap_app}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
    networks:
      - bap-network



networks:
  bap-network:
    driver: bridge

volumes:
  postgres_data:
