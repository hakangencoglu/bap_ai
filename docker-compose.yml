services:
  app:
    build: .
    image: ${CI_REGISTRY_IMAGE:-bap-app}:latest
    container_name: bap-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bap-network

networks:
  bap-network:
    driver: bridge
