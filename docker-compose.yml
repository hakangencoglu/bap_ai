services:
  app:
    build: .
    image: ${CI_REGISTRY_IMAGE:-bap-app}:latest
    container_name: bap-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/root/uploads
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16
    container_name: bap-db
    restart: unless-stopped
    network_mode: "host"
    environment:
      - POSTGRES_USER=bap
      - POSTGRES_PASSWORD=bap_admin_1
      - POSTGRES_DB=bap_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bap -d bap_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:

